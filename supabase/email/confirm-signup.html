<!-- Supabase → Authentication → Email Templates → Confirm signup -->
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;color:#1a1a1f;">
  <div style="font-size:17px;font-weight:600;letter-spacing:-0.2px;margin-bottom:28px;">DataStudio</div>

  <div style="font-size:15px;line-height:1.6;">
    <p style="margin:0 0 16px;">Confirm <strong>{{ .Email }}</strong> to finish setting up your account.</p>

    <p style="margin:0 0 24px;">
      <a href="{{ .ConfirmationURL }}"
         style="display:inline-block;background:#5B5FE8;color:#ffffff;text-decoration:none;padding:11px 20px;border-radius:8px;font-size:14px;font-weight:600;">
        Confirm this address
      </a>
    </p>

    <!-- The plain URL, always. Some clients strip the button, some people
         paste rather than click, and a fallback that says where it goes is
         what makes the message look legitimate rather than like phishing. -->
    <p style="margin:0 0 24px;font-size:12.5px;color:#6b6b76;line-height:1.5;">
      Or paste this into your browser:<br>
      <span style="word-break:break-all;color:#5B5FE8;">{{ .ConfirmationURL }}</span>
    </p>

    <p style="margin:0 0 8px;font-size:12.5px;color:#6b6b76;">
      The link works once and expires in 24 hours.
    </p>

    <!-- Says what to do if it was not you. An existing address that someone
         else tried to sign up with lands here too, and this is the only place
         the real owner finds out. -->
    <p style="margin:0;font-size:12.5px;color:#6b6b76;">
      If you didn't create an account, ignore this email — nothing was set up.
    </p>
  </div>
</div>
